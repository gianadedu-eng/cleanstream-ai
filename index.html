<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanStream AI</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f5f6f8;color:#18202a}.card{background:#fff;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 2px 10px #0001}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd2d9;border-radius:10px;font-size:17px}button{margin-top:10px;padding:11px 18px;border:0;border-radius:9px;font-weight:600}.result{margin-top:18px;padding:16px;border-radius:12px}.green{background:#dff5e5}.yellow{background:#fff0bf}.red{background:#ffdfe0}.muted{color:#66717c;font-size:14px}</style></head><body><div class="card"><h1>🧹 CleanStream AI</h1><p class="muted">Strict Clean · Age 10 · UK</p><input id="title" placeholder="Enter a programme title"><button onclick="analyse()">Analyse</button><div id="out"></div></div><script>async function analyse(){const t=document.getElementById('title').value.trim(),o=document.getElementById('out');if(!t)return;o.innerHTML='<p>Analysing…</p>';try{const r=await fetch('/api/analyse?title='+encodeURIComponent(t)),d=await r.json();o.innerHTML='<div class="result '+d.decision.toLowerCase()+'"><h2>'+d.emoji+' '+d.decision+'</h2><p><b>'+d.title+'</b></p><p>'+d.reason+'</p><p class="muted">'+d.source+'</p></div>'}catch(e){o.innerHTML='<p>Unable to analyse this title right now.</p>'}}</script></body></html>
