<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanStream AI v0.2</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#17202a}header{background:#17202a;color:#fff;padding:22px}main{max-width:850px;margin:20px auto;padding:0 16px}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd2d9;border-radius:10px;font-size:16px;margin:6px 0 12px}button{padding:11px 18px;border:0;border-radius:10px;background:#17202a;color:white;font-weight:700}.result{font-size:22px;font-weight:800}.GREEN{color:#176b31}.YELLOW{color:#755600}.RED{color:#9a1e26}.small{color:#68727d;font-size:13px}.item{margin:8px 0}</style></head><body><header><h1>🧹 CleanStream AI</h1><div>v0.2 — AI screening prototype</div></header><main><div class="card"><label><b>Programme title</b></label><input id="title" placeholder="e.g. The Baby-Sitters Club"><label><b>Evidence / synopsis (optional)</b></label><textarea id="evidence" rows="5" placeholder="Paste a synopsis, parental guide, review, episode description, etc."></textarea><button onclick="analyse()">Analyse</button><p class="small">For v0.2, reliable evidence is required for a confident decision. The engine will not invent missing facts.</p></div><div id="out"></div></main><script>
const refs={
'green eggs and ham':{d:'GREEN',r:['Comedy','Friendship','Family','Positive lessons']},'the inbestigators':{d:'GREEN',r:['Mystery','Friendship','Teamwork','Comedy']},'harvey girls forever!':{d:'GREEN',r:['Friendship','Comedy','Adventure']},'henry danger':{d:'YELLOW',r:['Crush/romantic material','Mild inappropriate humour','Cartoon violence']},'prince of peoria':{d:'RED',r:['Crushes/dating','Sexual innuendo','Mature joke']},'find me in paris':{d:'RED',r:['Teen romance','LGBTQ theme','Time travel/fantasy']},'dive club':{d:'RED',r:['Romance/flirting','Same-sex romantic content']},'icarly':{d:'RED',r:['Sexual jokes/references','Mature humour']},'how to train your dragon':{d:'YELLOW',r:['Fantasy/dragons','Mild romance']},'paddington':{d:'YELLOW',r:['Very mild romance/kissing','Alcohol reference','Mild language']}};
async function analyse(){const t=document.getElementById('title').value.trim(),e=document.getElementById('evidence').value.trim(),o=document.getElementById('out');if(!t)return;o.innerHTML='<div class="card">Analysing…</div>';const k=t.toLowerCase();if(refs[k]){show(t,refs[k].d,refs[k].r,'Calibration/reference result.');return}try{const res=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:t,evidence:e})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Analysis unavailable');show(t,data.decision,data.triggers||[],data.summary||'',data);}catch(err){o.innerHTML='<div class="card"><b>Evidence needed</b><p>'+err.message+'</p><p class="small">This title is not in the calibration set yet. In v0.2, the AI endpoint must be enabled on the Cloudflare Worker before unknown titles can be analysed.</p></div>'}}
function show(t,d,r,s,x={}){document.getElementById('out').innerHTML='<div class="card"><div class="result '+d+'">'+(d==='GREEN'?'🟢 APPROVED':d==='YELLOW'?'🟡 PARENT REVIEW':'🔴 EXCLUDED')+'</div><h2>'+esc(t)+'</h2><b>Triggers / factors</b><ul>'+r.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul><p>'+esc(s)+'</p>'+(x.confidence?'<p class="small">Confidence: '+esc(String(x.confidence))+'</p>':'')+'</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
